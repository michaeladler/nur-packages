name: build

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: michaeladler
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pathsToPush: |
            ./result

      - name: build
        run: |
          nix-shell \
            --command "just packagelist build-all" \
            -p nixVersions.latest just

      - name: cachix push
        run: |
          # cargoArtifacts are build-time inputs, absent from ./result's closure.
          # Substituting the package alone never builds them, so build first.
          while read -r pkg; do
            nix build --no-link --print-out-paths ".#$pkg.passthru.cargoArtifacts" 2>/dev/null |
              xargs -r cachix push michaeladler
          done < pkgs.txt
          find . -type l -name 'result*' | xargs cachix push michaeladler

      - name: Commit & Push changes
        uses: benkaiser/rebase-commit-push@v1.3
        with:
          message: "chore: update package list"
          rebase: true
